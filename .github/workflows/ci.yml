name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      - name: Validate JSON
        run: |
          python3 -m pip install jsonschema
          python3 -m json.tool schemas/gateway-config.schema.json >/dev/null
          python3 -m json.tool schemas/telemetry.schema.json >/dev/null
          python3 -m json.tool examples/gateway-config.example.json >/dev/null
          python3 -m json.tool examples/telemetry.example.json >/dev/null
          python3 tools/validate_schemas.py
      - name: Check documentation links
        run: python3 tools/check_doc_links.py
      - name: Validate frozen engineering review
        run: python3 tools/validate_review.py
      - name: Validate manufacturing release when present
        run: |
          if test -d release/edge18-rev-a; then
            python3 tools/validate_release.py
          fi
