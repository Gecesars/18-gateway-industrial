name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      - name: Validate JSON
        run: |
          python3 -m pip install jsonschema
          python3 -m json.tool schemas/gateway-config.schema.json >/dev/null
          python3 -m json.tool schemas/telemetry.schema.json >/dev/null
          python3 -m json.tool examples/gateway-config.example.json >/dev/null
          python3 -m json.tool examples/telemetry.example.json >/dev/null
          python3 tools/validate_schemas.py
      - name: Check documentation links
        run: python3 tools/check_doc_links.py
